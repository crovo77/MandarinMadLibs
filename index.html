<html lang='zh-Hans'>
<script src='https://d3js.org/d3.v7.min.js'></script>
<head>
    <meta charset='UTF-8'>
    <title>Mandarin Mad Libs</title>
    <style>
        body {
            background-color: rgb(240, 255, 240);
        }
        h1, h2, h3, h4, p {
            text-align: center;
            white-space: pre-wrap;
        }
        #master-container {
            display: flex;
            justify-content: center;
        }
        #center-container {
            text-align: left;
            white-space: pre-wrap;
            background-color: rgba(255, 182, 193, 0.56);
            min-width: 70%;
            min-height: 550px;
            border-radius: 20px;
        }
        #center-container p {
            font-size: 18px;
        }
        li {
            color: blue;
            transition: color 0.3s;
            cursor: pointer;
            font-size: 24px;
        }

        li:hover {
            color: lightskyblue;
        }

        #side-container {
            flex: 1;
            max-width: 30%;
            min-width: 200;
            display: flex;
            flex-direction: column;
            background-color: lightyellow;
            border-radius: 20px;
            height: 518px;
        }
        #side-container p {
            text-align: left;
            font-size: 20px;
            margin: 18px;
            overflow-y: scroll;
            overflow-x: hidden;
        }
        #navigation-container {
            display: flex;
            justify-content: center;
        }
        button {
            width: 150px;
            height: 50px;
            margin: 10px;
            font-size: x-large;
            text-align: center;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            background-color: lightskyblue;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #A9EEFC;
        }

    </style>
</head>
<header>
    <h3>Mandarin Mad Libs</h3>
</header>
<body onload='init()'>
    <div id='master-container'>
        <div id='center-container'>
            <h1></h1>
            <p></p>
        </div>
        <div id='side-container'>
            <h3>Your Answers:</h3>
            <p id='user-answers'></p>
        </div>
    </div>
    <p id='error-msg' style='color: red;'>Please fill all blanks before submitting.</p>
    <div id='navigation-container'>
        <button id='prevBtn' style='visibility: hidden;'>Go Back</button>
        <button id='nextBtn' style='visibility: hidden;'>Submit</button>
    </div>
     
    <script>
        const promptFormat = '.csv';
        const promptFolder = 'https://api.github.com/repos/crovo77/MandarinMadLibs/contents/prompts';
        async function fetchPromptNames() {
            try {
                const response = await fetch(promptFolder);
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
                const data = await response.json();
                const filenames = data.map(file => file.name.slice(0, -promptFormat.length));
                return filenames;
            } catch (error) {
                console.error('Failed to fetch file list:', error);
                return [];
            }
        }
        class Excerpt {
            constructor(value = '', type='readOnly') {
                this.value = value; this.type = type;
            }
        }

        let passage = null;
        let passageName = null;
        async function loadPrompt(promptName) {
            let psg = [];
            const rows = await d3.dsvFormat(',').parseRows(await d3.text('prompts/' + promptName + promptFormat));
            for (const row of rows) {
                // blanks will be at end of line and require a description. Empty end cells are treated as comma.
                if (row.length !== 1 && (psg.length === 0 || psg.at(-1).type !== 'readOnly')) {
                    psg.push(new Excerpt());
                }
                if (row.length === 0) psg.at(-1).value += '\n';
                else {
                    for (let i = 0; i < row.length - 1; i++) {
                        psg.at(-1).value += (row.at(i).length > 0)? row.at(i) : ',';
                    }
                    if (row.at(-1).length > 0) psg.push(new Excerpt('', row.at(-1)));
                }
            }
            return psg;
        }

        function getBlanks(prompt) {
            let blks = [];
            for (const excerpt of prompt) {
                if (excerpt.type !== 'readOnly') blks.push(excerpt);
            }
            return blks;
        }
        
        const side_cont = document.getElementById('side-container');
        const error_msg = document.getElementById('error-msg');

        let currPage = 0;
        const totalPages = 3;
        async function setPage(pageNum) {
            if (pageNum > 0 && (passage === null || passageName === null)) pageNum = 0; // all other pages require passage populated
            prevBtn.style.visibility = nextBtn.style.visibility = ((pageNum > 0)? 'visible' : 'hidden');
            resetCenter();
            side_cont.style.display = 'none'; // default is hidden
            let blanks = null;
            switch (pageNum) {
            case 0:
                passage = null;
                error_msg.style.visibility = 'hidden';
                const promptNames = await fetchPromptNames();
                sceneTitle('Please select a prompt:');
                promptSelect(promptNames);
                break;
            case 1:
                sceneTitle(passageName);
                blanks = getBlanks(passage);
                nextBtn.textContent = 'Submit';
                const rows = disp.select('p')
                    .selectAll('div.blank-row')
                    .data(blanks)
                    .enter()
                    .append('div')
                    .attr('class', 'blank-row')
                    .style('margin', '10px 0')
                    .style('text-align', 'right');

                rows.append('label')
                    .text(d => d.type + ' : ')
                    .style('margin-right', '10px');

                rows.append('input')
                    .attr('type', 'text')
                    .property('value', d => d.value)
                    .style('width', '200px')
                    .on('input', function(event, d) {
                        d.value = this.value;
                    });
                break;
            case 2:
                blanks = getBlanks(passage);
                if (!allFilled(blanks)) {
                    error_msg.style.visibility = 'visible';
                    setPage(1);
                    return;
                }
                error_msg.style.visibility = 'hidden';
                sceneTitle(passageName);
                nextBtn.textContent = 'New Prompt';
                let user_ans_paragraph = '';
                for (const blank of blanks) {
                    user_ans_paragraph += blank.type + ' : ' + blank.value + '\n\n';
                }
                d3.select('#user-answers').text(user_ans_paragraph);
                side_cont.style.display = 'flex';
                disp.select('p').selectAll('span').data(passage).enter().append('span')
                .text(d => d.value)
                .style('color', d => (d.type === 'readOnly')? 'black' : 'red');
                break;
            default:
                break;
            }
            currPage = pageNum;
        }
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        async function init() {
            prevBtn.addEventListener('click', async function prevPage() {
                await setPage(Math.max(currPage - 1, 0));
            });
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.addEventListener('click', async function nextPage() {
                await setPage((currPage + 1) % totalPages);
            });
            setPage(currPage);
        }
        
        const margins = { top: 40, left: 80, bottom: 70, right: 30};
        const width = (window.screen.width * 19 / 24) - 20;
        const height = (window.screen.height * 3 / 5) - 20;

        const disp = d3.select('#center-container')
                        .attr('width', width+margins.left+margins.right).attr('height', height+margins.top+margins.bottom);

        function sceneTitle(title) {
            disp.select('h1').text(title);
        }

        function promptSelect(promptNames) {
            disp.select('p').selectAll('li').data(promptNames).enter().append('li')
                .text(d => d)
                .attr('class', 'list-item')
                .on('click', async function (event, d) {
                    passage = await loadPrompt(d);
                    passageName = d;
                    setPage(1);
                });
        }

        function allFilled(blanks) {
            return blanks.every(b => b.value && b.value.trim().length);
        }

        function resetCenter() { disp.select('p').selectAll('*').remove(); }
    </script>
</body>
</html>
