    <div id='master-container'>

    <div id='navigation-container'>
        <button id='prevBtn'>Go Back</button>
        <button id='nextBtn'>Submit</button>

    <script>
        const margins = { top: 40, left: 80, bottom: 70, right: 30};
        const width = (window.screen.width * 19 / 24) - 20;
        const height = (window.screen.height * 3 / 5) - 20;
        const disp = d3.select('#center-container')
                        .attr('width', width+margins.left+margins.right).attr('height', height+margins.top+margins.bottom);
        const sceneTitle = d3.select('#sceneTitle');
        const sceneContent = d3.select('#sceneContent');
        const underlineContent = d3.select('#underlineContent').on('keydown', underlineWithSpace);
        const storyInputArea = d3.select('#storyInputArea');
        const side_cont = d3.select('#side-container');
        const user_ans = d3.select('#user-answers');
        const promptFormat = '.csv';
        const promptFolder = 'https://api.github.com/repos/crovo77/MandarinMadLibs/contents/prompts';
        async function fetchPromptNames() {
            try {
                const response = await fetch(promptFolder);
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
                const data = await response.json();
                const filenames = data.map(file => file.name.slice(0, -promptFormat.length));
                return filenames;
            } catch (error) {
                console.error('Failed to fetch file list:', error);
                return [];
            }
        }
        class Excerpt {
            constructor(value = '', type='readOnly') {
                this.value = value; this.type = type;
            }
        }

        let passage = null; // an array of Excerpt objects
        let passageName = null;
        let blanks = null;
        function clearPassage() {
            passageName = null;
            passage = null;
            blanks = null;
        }

        function setPageToDefault(pageNum) {
            prevBtn.textContent = 'Previous';
            nextBtn.textContent = 'Next';
            prevBtn.style.display = (pageNum > 0)? 'inline-block': 'none';
            nextBtn.style.display = 'inline-block';
            disp.selectChildren().style('display', 'none');
            sceneTitle.style('display', 'block');
            sceneContent.style('display', 'block')
                .attr('contenteditable', 'false').on('keydown', null)
                .selectAll('*').remove();
            side_cont.style('display', 'none'); // default is hidden
        }

        let currPage = 0;
        const totalPages = 3;
        async function setPage(pageNum) {
            // page out of range or empty passage typically triggers reset
            if (pageNum >= totalPages || (!creatingPrompt && passage === null)) {
                // don't reset if we are trying but failing to submit new prompt
                if (creatingPrompt && !(await submitNewPrompt())) return;
                creatingPrompt = false;
                pageNum = 0;
            }
            setPageToDefault(pageNum);
            switch (pageNum + (creatingPrompt? totalPages : 0)) {
            case 0:
                sceneTitle.text('Please select a prompt:');
                clearPassage();
                const promptNames = await fetchPromptNames();
                promptSelect(promptNames);
                nextBtn.style.display = 'none';
                break;
            case 1:
                sceneTitle.text(passageName);
                nextBtn.textContent = 'Submit';
                const rows = disp.select('p')
                    .selectAll('div.blank-row')
                    .data(blanks)
                    .enter()
                    .append('div')
                    .attr('class', 'blank-row')
                    .style('margin', '10px auto')
                    .style('display', 'flex')
                    .style('justify-content', 'space-between')
                    .style('align-items', 'center')
                    .style('max-width', '400px');

                rows.append('label')
                    .text(d => d.type + ' : ')
                    .style('margin-right', '10px');

                rows.append('input')
                    .attr('type', 'text')
                    .property('value', d => d.value)
                    .style('width', '200px')
                    .on('input', function(event, d) {
                        d.value = this.value;
                    });
                break;
            case 2:
                if (!allFilled(blanks)) {
                    alert('Please fill all blanks before submitting.');
                    setPage(1); return;
                }
                sceneTitle.text(passageName);
                nextBtn.textContent = 'Do Another';
                let user_ans_paragraph = '';
                for (const blank of blanks) {
                    user_ans_paragraph += blank.type + ' : ' + blank.value + '\n\n';
                }
                user_ans.text(user_ans_paragraph);
                side_cont.style('display', 'flex');
                sceneContent.selectAll('span').data(passage).enter().append('span')
                .style('white-space', 'pre-wrap')
                .text(d => d.value)
                .style('color', d => (d.type === 'readOnly')? 'black' : 'red');
                break;

            // these pages are when we are creating a prompt
            case 3:
                sceneTitle.text('Create a Prompt!\nFirst write a story:');
                sceneContent.style('display', 'none');
                storyInputArea.style('display', 'inline-block');
                break;
            case 4:
                sceneTitle.text('Select text, then press <Spacebar> to convert to a blank.');
                sceneContent.style('display', 'none');
                underlineContent.style('display', 'block').attr('contenteditable', 'true');
                let storyInput = storyInputArea.property('value');
                if (storyInput !== underlineContent.text()) underlineContent.text(storyInput);
                break;
            case 5:
                sceneTitle.text('Finally, add a title and rename blanks to become prompts.');
                underlineContent.style('display', 'block').attr('contenteditable', 'false');
                let excerpts = createdPassageToExcerpts(underlineContent.node());
                if (excerpts.length <= 1) { // a single excerpt indicates no blanks
                    alert('Please form some blanks in order to continue.');
                    setPage(1); return; // goes to previous page (4)
                }
                passage = [new Excerpt('', 'Title')].concat(excerpts);
                
                nextBtn.textContent = 'Submit';
                blanks = getBlanks(passage);
                const rws = sceneContent.selectAll('div.blank-row')
                    .data(blanks)
                    .enter()
                    .append('div')
                    .attr('class', 'blank-row')
                    .style('margin', '10px auto')
                    .style('display', 'flex')
                    .style('justify-content', 'space-between')
                    .style('align-items', 'center')
                    .style('max-width', '400px');
                rws.append('input')
                    .attr('type', 'text')
                    .property('value', d => d.type)
                    .style('width', '200px')
                    .on('input', function(event, d) {
                        d.value = this.value;
                    });
                rws.append('label')
                    .text(d => ' : ' + d.type)
                    .style('margin-right', '10px');
                break;
            }
            currPage = pageNum;
        }
        
        function createdPassageToExcerpts(container) {
            const excerpts = [];
            container.childNodes.forEach(node => {
                // not underlined
                if (node.nodeType === Node.TEXT_NODE) {
                    if (node.textContent.length > 0) {
                        excerpts.push(new Excerpt(node.textContent));
                    }
                }
                // underlined
                else if (
                    node.nodeType === Node.ELEMENT_NODE &&
                    node.classList.contains('blank')
                ) {
                    excerpts.push(new Excerpt('', node.textContent));
                }
            });
            return excerpts;
        }

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const createPromptButton = document.getElementById('createPromptButton');

        let creatingPrompt = false;
        async function init() {
            prevBtn.addEventListener('click', async function prevPage() {
                await setPage(Math.max(currPage - 1, 0));
            });
            nextBtn.addEventListener('click', async function nextPage() {
                await setPage(currPage + 1);
            });
            createPromptButton.addEventListener('click', async function toggleMode() {
                if (!creatingPrompt && idToken === null) {
                    alert('Please Sign-in to Google first.');
                    return;
                }
                creatingPrompt = !creatingPrompt;
                clearPassage();
                await setPage(0);
            });
            setPage(currPage);
        }
        
        function promptSelect(filenames) {
            const titleMap = new Map();
            for (let i = 0; i < filenames.length; i++) {
                const match = filenames[i].match(/^(.*)(_)(\d+)$/);
                if (!match) continue;
                // helps enumerate repeat titles
                mapGet(titleMap, match[1], []).push({filenum: i, rank: +match[3]});
            }
            const promptInfo = [];
            titleMap.forEach((enums, title) => {
                if (enums.length === 1) promptInfo.push([title, enums[0].filenum]);
                else {
                    enums.sort((a, b) => a.rank - b.rank);
                    enums.forEach(enu => {
                        promptInfo.push([title, enu.filenum, enu.rank]);
                    });
                }
            });
            sceneContent.selectAll('li').data(promptInfo).enter().append('li')
                .text(d => ((d.length > 2)? `${d[0]} (${d[2]})` : `${d[0]}`))
                .attr('class', 'list-item')
                .on('click', async function (event, info) {
                    await loadPrompt(filenames[info[1]]);
                    setPage(1);
                });
        }

        function allFilled(blanks) {
            return blanks.every(b => b.value && b.value.trim().length);
        }

        let idToken = null;
        function handleLogin(response) {
            idToken = response.credential;
            console.log('Logged in');
        }

        async function submitNewPrompt() {
            if (!idToken) {
                alert('Please login to Google first');
                return false;
            } 
            const csv_f = createPassageCSV(passage);
            const res = await uploadPrompt(csv_f);
            alert(res);
            return true;
        }

        function createPassageCSV(exArr) {
            let csv = exArr[0].value; // start with title
            for (let i = 1; i < exArr.length; i++) {
                csv += (exArr[i - 1].type !== 'readOnly')? '\n' : ',';
                if (exArr[i].type !== 'readOnly') {
                    csv += exArr[i].value.replaceAll(',', ' ');
                } else {
                    let posRep = exArr[i].value.replaceAll(',', ',,');
                    if (posRep[0] === ',') posRep = posRep.slice(1);
                    csv += posRep;
                }
            }
            if (exArr[exArr.length - 1].type === 'readOnly') csv += ',';
            return csv;
        }

        async function uploadPrompt(prompt) {
            if (!idToken) return null;
            const bytes = new TextEncoder().encode(prompt);
            const strFromCharCode = String.fromCharCode(...bytes);
            const encodedCsv = btoa(strFromCharCode);

            const response = await fetch('https://wild-cloud-34da.crovo77.workers.dev', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    token: idToken,
                    encodedCsv: encodedCsv
                })
            });
            return await response.text();
        }

        async function loadPrompt(promptName) {
            let psg = [];
            const rows = await d3.dsvFormat(',').parseRows(await d3.text('prompts/' + promptName + promptFormat));
            for (let i = 1; i < rows.length; i++) {
                const row = rows.at(i);
                // blanks will be at end of line and require a description. Empty end cells are treated as comma.
                if (row.length !== 1 && (psg.length === 0 || psg.at(-1).type !== 'readOnly')) {
                    psg.push(new Excerpt());
                }
                if (row.length === 0) psg.at(-1).value += '\n';
                else {
                    for (let i = 0; i < row.length - 1; i++) {
                        psg.at(-1).value += (row.at(i).length > 0)? row.at(i) : ',';
                    }
                    if (row.at(-1).length > 0) psg.push(new Excerpt('', row.at(-1)));
                }
            }
            passageName = rows.at(0).at(0);
            passage = psg;
            blanks = getBlanks(psg);
        }

        function getBlanks(prompt) {
            let blks = [];
            for (const excerpt of prompt) {
                if (excerpt.type !== 'readOnly') blks.push(excerpt);
            }
            return blks;
        }

        function mapGet(mp, key, def) {
            if (!mp.has(key)) mp.set(key, def);
            return mp.get(key);
        }

        function getSelectionOffsets() {
            const sel = window.getSelection();
            if (!sel.rangeCount || sel.isCollapsed) return null;
            const range = sel.getRangeAt(0);
            const preRange = range.cloneRange();
            preRange.selectNodeContents(underlineContent.node());
            preRange.setEnd(range.startContainer, range.startOffset);
            const start = preRange.toString().length;
            const length = range.toString().length;
            return {
                start,
                end: start + length
            };
        }

        function getTokens() {
            const tokens = [];
            underlineContent.node().childNodes.forEach(node => {
                if (node.nodeType === Node.TEXT_NODE) {
                    tokens.push({
                        text: node.textContent,
                        underlined: false
                    });
                } else if (node.nodeType === Node.ELEMENT_NODE &&
                        node.classList.contains('blank')) {
                    tokens.push({
                        text: node.textContent,
                        underlined: true
                    });
                }
            });
            return tokens;
        }

        function renderTokens(tokens) {
            underlineContent.html('');
            tokens.forEach(token => {
                if (!token.text.length) {
                    console.log('there should not be empty tokens');
                    return;
                }
                if (token.underlined) {
                    const span = document.createElement('span');
                    span.classList.add('blank');
                    span.style.textDecoration = 'underline';
                    span.textContent = token.text;
                    underlineContent.node().appendChild(span);
                }
                else {
                    underlineContent.node().appendChild(
                        document.createTextNode(token.text)
                    );
                }
            });

            underlineContent.node().normalize();
        }

        function underlineWithSpace(event) {
            event.preventDefault();
            if (event.key !== ' ') return;
            const offsets = getSelectionOffsets();
            if (!offsets) return;
            let { start, end } = offsets;
            const fullText = underlineContent.node().textContent;
            // Step 1: trim whitespace
            while (start < end && /\s/.test(fullText[start])) start++;
            while (end > start && /\s/.test(fullText[end - 1])) end--;
            if (start >= end) return;
            let tokens = getTokens();
            // Compute absolute ranges for each token
            let cursor = 0;
            tokens = tokens.map(t => {
                const obj = {
                    ...t,
                    start: cursor,
                    end: cursor + tokenTxt.length
                };
                cursor += tokenTxt.length;
                return obj;
            });
            // Step 3: find all overlapping tokens
            const overlapping = tokens.filter(t =>
                !(t.end <= start || t.start >= end)
            );
            const containsUnderline = overlapping.some(t => t.underlined);
            if (containsUnderline) {
                // Step 4: merge all overlapping into ONE non-underlined token
                const firstIndex = tokens.indexOf(overlapping[0]);
                let hostIndex = firstIndex;
                if (overlapping[0].underlined && firstIndex > 0) {
                    hostIndex = firstIndex - 1;
                }
                const host = tokens[hostIndex];
                // Combine text exactly as it exists
                const mergedText = overlapping.map(t => t.text).join('');
                host.text += mergedText;
                host.underlined = false;
                tokens = tokens.filter(t =>
                    !overlapping.includes(t) || t === host
                );
            }
            // Step 5: split
            const newTokens = [];
            tokens.forEach(t => {
                if (t.end <= start || t.start >= end) {
                    newTokens.push({ text: t.text, underlined: t.underlined });
                    return;
                }
                const selStart = Math.max(start, t.start);
                const selEnd = Math.min(end, t.end);
                const before = t.text.slice(0, selStart - t.start);
                const middle = t.text.slice(selStart - t.start, selEnd - t.start);
                const after = t.text.slice(selEnd - t.start);
                if (before) {
                    newTokens.push({ text: before, underlined: false });
                }
                newTokens.push({
                    text: middle,
                    underlined: true
                });
                if (after) {
                    newTokens.push({ text: after, underlined: false });
                }
            });
            tokens = newTokens;
            renderTokens(tokens);
            window.getSelection().removeAllRanges();
        }
