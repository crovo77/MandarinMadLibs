<html lang='zh-Hans'>
<script src='https://d3js.org/d3.v7.min.js'></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<div id='g_id_onload'
     data-client_id='152946003675-gp8n3h0ike46cf14cmg7dprjm5kp0r0c.apps.googleusercontent.com'
     data-callback='handleLogin'>
</div>
<div id='menuBar'>
    <button id='createPromptButton'>Create Prompt</button>
    <div class='g_id_signin'></div>
</div>
<head>
    <meta charset='UTF-8'>
    <title>Mandarin Mad Libs</title>
    <style>
        body {
            background-color: rgb(240, 255, 240);
        }
        h1, h2, h3, h4, p {
            text-align: center;
            white-space: pre-wrap;
        }
        #master-container {
            display: flex;
            justify-content: center;
        }
        #center-container {
            text-align: left;
            white-space: pre-wrap;
            background-color: rgba(255, 182, 193, 0.56);
            min-width: 60%;
            min-height: 518px;
            border-radius: 20px;
        }
        #center-container p {
            font-size: 22px;
            margin: 35px;
        }
        li {
            color: blue;
            transition: color 0.3s;
            cursor: pointer;
            font-size: 24px;
        }

        li:hover {
            color: lightskyblue;
        }

        #side-container {
            flex: 1;
            max-width: 30%;
            min-width: 20%;
            display: flex;
            flex-direction: column;
            background-color: lightyellow;
            border-radius: 20px;
            height: 518px;
        }
        #side-container p {
            text-align: left;
            font-size: 20px;
            margin: 18px;
            overflow-y: scroll;
            overflow-x: hidden;
        }
        #navigation-container {
            display: flex;
            justify-content: center;
        }
        #menuBar {
            display: flex;
            justify-content: right;
        }
        #createPromptButton {
            border-radius: 5px;
            width: 200px;
            height: 40px;
        }
        .g_id_signin {
            width: 200px;
            height: 50px;
            margin: 10px;
        }
        button {
            width: 150px;
            height: 50px;
            margin: 10px;
            font-size: x-large;
            text-align: center;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            background-color: lightskyblue;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #A9EEFC;
        }
        #promptInput {
            height: 400px;
            width: 800px;
            min-width: 400px;
            max-width: 1120px;
            min-height: 300px;
        }

    </style>
</head>
<header>
    <h3>Mandarin Mad Libs</h3>
</header>
<body onload='init()'>
    <div id='master-container'>
        <div id='center-container'>
            <h1></h1>
            <p></p>
        </div>
        <div style='min-width: 20px'></div>
        <div id='side-container'>
            <h3>Your Answers:</h3>
            <p id='user-answers'></p>
        </div>
    </div>
    <p id='error-msg' style='color: red;'>Please fill all blanks before submitting.</p>
    <div id='navigation-container'>
        <button id='prevBtn' style='visibility: hidden;'>Go Back</button>
        <button id='nextBtn' style='visibility: hidden;'>Submit</button>
    </div>
     
    <script>
        const promptFormat = '.csv';
        const promptFolder = 'https://api.github.com/repos/crovo77/MandarinMadLibs/contents/prompts';
        async function fetchPromptNames() {
            try {
                const response = await fetch(promptFolder);
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
                const data = await response.json();
                const filenames = data.map(file => file.name.slice(0, -promptFormat.length));
                return filenames;
            } catch (error) {
                console.error('Failed to fetch file list:', error);
                return [];
            }
        }
        class Excerpt {
            constructor(value = '', type='readOnly') {
                this.value = value; this.type = type;
            }
        }

        // detect spacebar presses for when creating a prompt on second page
        function underlineWithSpace(event) {
            event.preventDefault();
            if (creatingPrompt && currPage === 1 && event.key === ' ' && createPromptText !== null) {
                const selection = window.getSelection();
                if (!selection.rangeCount || selection.isCollapsed) return;
                const range = selection.getRangeAt(0);
                const spn = document.createElement('u'); // Underline element
                range.surroundContents(spn);
                selection.removeAllRanges();
            }
        };

        let passage = null;
        let passageName = null;
        async function loadPrompt(promptName) {
            let psg = [];
            const rows = await d3.dsvFormat(',').parseRows(await d3.text('prompts/' + promptName + promptFormat));
            for (let i = 1; i < rows.length; i++) {
                const row = rows.at(i);
                // blanks will be at end of line and require a description. Empty end cells are treated as comma.
                if (row.length !== 1 && (psg.length === 0 || psg.at(-1).type !== 'readOnly')) {
                    psg.push(new Excerpt());
                }
                if (row.length === 0) psg.at(-1).value += '\n';
                else {
                    for (let i = 0; i < row.length - 1; i++) {
                        psg.at(-1).value += (row.at(i).length > 0)? row.at(i) : ',';
                    }
                    if (row.at(-1).length > 0) psg.push(new Excerpt('', row.at(-1)));
                }
            }
            return psg;
        }

        function getBlanks(prompt) {
            let blks = [];
            for (const excerpt of prompt) {
                if (excerpt.type !== 'readOnly') blks.push(excerpt);
            }
            return blks;
        }
        
        const side_cont = document.getElementById('side-container');
        const error_msg = document.getElementById('error-msg');

        let currPage = 0;
        const totalPages = 3;
        let creatingPrompt = false;
        let createPromptText = null;
        let createPromptPassage = null;
        async function setPage(pageNum) {
            if (creatingPrompt && currPage === 2 && pageNum === 0) {
                const csv_f = createCSVFromPassage(createPromptPassage);
                uploadPrompt(csv_f);
                creatingPrompt = false;
                setPage(0);
                return;
            }
            if (!creatingPrompt && pageNum > 0 && (passage === null || passageName === null)) pageNum = 0; // all other pages require passage populated
            prevBtn.style.visibility = nextBtn.style.visibility = ((pageNum > 0)? 'visible' : 'hidden');
            let createPromptInputSel = d3.select('#promptInput');
            let posPromptText = (!createPromptInputSel.empty())? createPromptInputSel.property('value') : null;
            if (posPromptText !== null) {
                createPromptText = posPromptText;
                createPromptPassage = null;
            }
            createPromptInputSel = d3.select('#underlineInput');
            let posPromptUnderlines = (!createPromptInputSel.empty())? createdPassageToExcerpts(createPromptInputSel.node()) : null;
            if (posPromptUnderlines !== null) {
                if (posPromptUnderlines.length <= 1) {
                    pageNum = currPage;
                    alert('Please form some blanks in order to continue.');
                }
                createPromptPassage = [new Excerpt('', 'Title')].concat(posPromptUnderlines);
            }
            resetCenter();
            prevBtn.textContent = 'Previous';
            nextBtn.textContent = 'Next';
            side_cont.style.display = 'none'; // default is hidden
            let blanks = null;
            switch (pageNum + (creatingPrompt? 3 : 0)) {
            case 0:
                passage = null;
                error_msg.style.visibility = 'hidden';
                const promptNames = await fetchPromptNames();
                sceneTitle('Please select a prompt:');
                promptSelect(promptNames);
                break;
            case 1:
                sceneTitle(passageName);
                blanks = getBlanks(passage);
                nextBtn.textContent = 'Submit';
                const rows = disp.select('p')
                    .selectAll('div.blank-row')
                    .data(blanks)
                    .enter()
                    .append('div')
                    .attr('class', 'blank-row')
                    .style('margin', '10px auto')
                    .style('display', 'flex')
                    .style('justify-content', 'space-between')
                    .style('align-items', 'center')
                    .style('max-width', '400px');

                rows.append('label')
                    .text(d => d.type + ' : ')
                    .style('margin-right', '10px');

                rows.append('input')
                    .attr('type', 'text')
                    .property('value', d => d.value)
                    .style('width', '200px')
                    .on('input', function(event, d) {
                        d.value = this.value;
                    });
                break;
            case 2:
                blanks = getBlanks(passage);
                if (!allFilled(blanks)) {
                    error_msg.style.visibility = 'visible';
                    setPage(1);
                    return;
                }
                error_msg.style.visibility = 'hidden';
                sceneTitle(passageName);
                nextBtn.textContent = 'New Prompt';
                let user_ans_paragraph = '';
                for (const blank of blanks) {
                    user_ans_paragraph += blank.type + ' : ' + blank.value + '\n\n';
                }
                d3.select('#user-answers').text(user_ans_paragraph);
                side_cont.style.display = 'flex';
                disp.select('p').selectAll('span').data(passage).enter().append('span')
                .style('white-space', 'pre-wrap')
                .text(d => d.value)
                .style('color', d => (d.type === 'readOnly')? 'black' : 'red');
                break;
            case 3:
                sceneTitle('Create a Prompt!\nFirst write a story:');
                disp.select('p').append('textarea').attr('id', 'promptInput')
                .attr('placeholder', (createPromptText !== null)? createPromptText : 'Enter text here');
                nextBtn.textContent = 'Next';
                nextBtn.style.visibility = 'visible';
                break;
            case 4:
                sceneTitle('Select text, then press <Spacebar> to convert to a blank.');
                disp.select('p').attr('contenteditable', 'true').attr('id', 'underlineInput').text(createPromptText)
                .on('keydown', underlineWithSpace);
                prevBtn.textContent = 'Restart';
                break;
            case 5:
                sceneTitle('Finally, add a title and rename blanks to become prompts.');
                nextBtn.textContent = 'Submit';
                blanks = getBlanks(createPromptPassage);
                const rws = disp.select('p')
                    .selectAll('div.blank-row')
                    .data(blanks)
                    .enter()
                    .append('div')
                    .attr('class', 'blank-row')
                    .style('margin', '10px auto')
                    .style('display', 'flex')
                    .style('justify-content', 'space-between')
                    .style('align-items', 'center')
                    .style('max-width', '400px');
                rws.append('input')
                    .attr('type', 'text')
                    .property('value', d => d.type)
                    .style('width', '200px')
                    .on('input', function(event, d) {
                        d.value = this.value;
                    });
                rws.append('label')
                    .text(d => ' : ' + d.type)
                    .style('margin-right', '10px');
                break;
            default:
                break;
            }
            currPage = pageNum;
        }
        
        function createdPassageToExcerpts(container) {
            const children = Array.from(container.childNodes);
            return children.map(node => ((node.nodeName === 'U')? (new Excerpt('', node.textContent)) : (new Excerpt(node.textContent))));
        }

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const createPromptButton = document.getElementById('createPromptButton');
        async function init() {
            prevBtn.addEventListener('click', async function prevPage() {
                await setPage(Math.max(currPage - 1, 0));
            });
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.addEventListener('click', async function nextPage() {
                await setPage((currPage + 1) % totalPages);
            });
            createPromptButton.addEventListener('click', async function toggleMode() {
                if (!creatingPrompt && idToken === null) {
                    alert('Please Sign-in to Google first.');
                    return;
                }
                createPromptText = null;
                createPromptPassage = null;
                creatingPrompt = !creatingPrompt;
                passage = null;
                passageName = null;
                await setPage(0);
            });
            setPage(currPage);
        }
        
        const margins = { top: 40, left: 80, bottom: 70, right: 30};
        const width = (window.screen.width * 19 / 24) - 20;
        const height = (window.screen.height * 3 / 5) - 20;

        const disp = d3.select('#center-container')
                        .attr('width', width+margins.left+margins.right).attr('height', height+margins.top+margins.bottom);

        function sceneTitle(title) {
            disp.select('h1').text(title);
        }

        function promptSelect(promptNames) {
            disp.select('p').selectAll('li').data(promptNames).enter().append('li')
                .text(d => d)
                .attr('class', 'list-item')
                .on('click', async function (event, d) {
                    passage = await loadPrompt(d);
                    passageName = d;
                    setPage(1);
                });
        }

        function allFilled(blanks) {
            return blanks.every(b => b.value && b.value.trim().length);
        }

        function resetCenter() { disp.select('p').selectAll('*').remove(); }

        let idToken = null;
        function handleLogin(response) {
            idToken = response.credential;
            console.log('Logged in');
        }

        function createCSVFromPassage(exArr) {
            let csv = exArr[0].value; // start with title
            for (let i = 1; i < exArr.length; i++) {
                csv += (exArr[i - 1].type !== 'readOnly')? '\n' : ',';
                if (exArr[i].type !== 'readOnly') {
                    csv += exArr[i].value.replaceAll(',', ' ');
                } else {
                    let posRep = exArr[i].value.replaceAll(',', ',,');
                    if (posRep[0] === ',') posRep = posRep.slice(1);
                    csv += posRep;
                }
            }
            if (exArr[exArr.length - 1].type === 'readOnly') csv += ',';
            return csv;
        }

        async function uploadPrompt(prompt) {
            if (!idToken) { alert('Please log in first'); return; }
            const bytes = new TextEncoder().encode(prompt);
            const strFromCharCode = String.fromCharCode(...bytes);
            const encodedCsv = btoa(strFromCharCode);

            const response = await fetch('https://wild-cloud-34da.crovo77.workers.dev', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    token: idToken,
                    encodedCsv: encodedCsv
                })
            });
            const result = await response.text();
            alert(result);
        }

    </script>
</body>
</html>
